aid: runwhen
name: RunWhen
description: >-
  RunWhen is an AI platform for building safe-for-production agents that triage alerts, remediate
  infrastructure, analyze cost, and answer questions about production systems. Engineering teams
  compose reusable "Skills" (CodeBundles) into agents that run standalone or from Claude, Cursor,
  and VS Code via the RunWhen Platform MCP server. The RunWhen Platform API (PAPI) is a versioned
  REST API (OpenAPI 3.1, 417 operations) over workspaces, SLXs/SLIs/SLOs, runbooks, run sessions,
  issues, personas, and workflows, authenticated with JWT bearer tokens and an OAuth/OIDC
  authorization server. RunWhen was surfaced as a Seedcamp portfolio company and enriched into the
  API Evangelist network.
