openapi: 3.2.0
info:
  title: papi Health API
  description: RunWhen Platform API
  version: 2.0.0
tags:
- name: Health
paths:
  /:
    get:
      tags:
      - Health
      summary: Root
      description: Root endpoint for nginx-ingress backend health checks.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
      security:
      - BearerAuth: []
  /healthz:
    get:
      tags:
      - Health
      summary: Health
      description: 'Check overall service health.


        Used by K8s readiness and startup probes.

        Returns 503 during graceful shutdown to drain traffic.


        Returns:

        Health status with version information.'
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /health:
    get:
      tags:
      - Health
      summary: Health
      description: 'Check overall service health.


        Used by K8s readiness and startup probes.

        Returns 503 during graceful shutdown to drain traffic.


        Returns:

        Health status with version information.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /livez:
    get:
      tags:
      - Health
      summary: Liveness
      description: 'Liveness probe endpoint.


        Used by K8s liveness probe.


        Returns:

        Liveness status.'
      operationId: liveness_livez_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Liveness Livez Get
      security: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /api/v3/token/ or Auth0 login
