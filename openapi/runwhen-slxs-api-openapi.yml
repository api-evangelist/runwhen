      title: SlxResponse
      description: "Legacy V1/V3 shape: V4 fields + computed ``spec`` and ``status`` for Django-era consumers.\n\nSubclassing keeps flat fields in lock-step with V4. Computed fields rebuild the\nCRD-shape sub-objects from flat ones at serialization time. Sunset path: when\nexternal consumers fully migrate to /api/v4, delete this subclass.\n\nLegacy wire keys preserved by overriding three aliased fields:\n  - ``workspace_id`` → alias ``workspace`` (was ``workspaceId`` in V4)\n  - ``created_at``   → alias ``created``   (was ``createdAt`` in V4)\n  - ``modified_at``  → alias ``modified``  (was ``modifiedAt`` in V4)\n  - ``image_url``    → accepts both ``imageURL`` (legacy) and ``imageUrl`` (V4)"
