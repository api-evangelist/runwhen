openapi: 3.1.0
info:
  title: papi alert-query-proxy social-auth API
  description: RunWhen Platform API
  version: 2.0.0
tags:
- name: social-auth
paths:
  /accounts/google/login/:
    get:
      tags:
      - social-auth
      summary: Google Login
      description: Initiate Google OAuth2 login.
      operationId: google_login_accounts_google_login__get
      parameters:
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
      - name: oauth_session
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /accounts/google/login/callback/:
    get:
      tags:
      - social-auth
      summary: Google Callback
      description: Handle Google OAuth2 callback.
      operationId: google_callback_accounts_google_login_callback__get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /accounts/github/login/:
