      description: "Get a runner registration token for a workspace.\n\nRequires admin permission on the workspace.\nCalls the internal runner service to generate a token.\n\nArgs:\n    workspace_name: The workspace name.\n    location: The location name for the runner.\n    session: Database session.\n    current_user: The authenticated user.\n\nReturns:\n    The runner token response from the runner service.\n\nRaises:\n    HTTPException: 404 if workspace not found.\n    HTTPException: 403 if user lacks admin permission.\n    HTTPException: 422 if location not provided.\n    HTTPException: 503 if runner service unavailable."
