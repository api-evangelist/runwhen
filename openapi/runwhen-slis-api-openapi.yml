components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    papi__schemas__sli__SliResponse:
      properties:
        slxId:
          type: integer
          title: Slxid
        displayUnitsLong:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayunitslong
        displayUnitsShort:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayunitsshort
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        runnerUuid:
          anyOf:
          - type: string
          - type: 'null'
          title: Runneruuid
        intervalStrategy:
          type: string
          title: Intervalstrategy
          default: intermezzo
        intervalSeconds:
          type: integer
          title: Intervalseconds
          default: 300
        codeBundleRepoUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Codebundlerepourl
        codeBundleRef:
          anyOf:
          - type: string
          - type: 'null'
          title: Codebundleref
        codeBundlePath:
          anyOf:
          - type: string
          - type: 'null'
          title: Codebundlepath
        repositoryId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Repositoryid
        configProvided:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - additionalProperties: true
            type: object
          title: Configprovided
        secretsProvided:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Secretsprovided
        alertConfig:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Alertconfig
        lastRunCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastruncode
        lastRunMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastrunmessage
        lastRunAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lastrunat
        firingAlerts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Firingalerts
        lastSevenDaysAlerts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Lastsevendaysalerts
        alertCount:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Alertcount
        recent:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Recent
        created:
          type: string
          format: date-time
          title: Created
          description: Creation timestamp
        modified:
          type: string
          format: date-time
          title: Modified
          description: Last update timestamp
        spec:
          additionalProperties: true
          type: object
          title: Spec
          description: Spec dict matching Django CoreModelSerializer shape.
          readOnly: true
        status:
          additionalProperties: true
          type: object
          title: Status
          description: Status dict matching Django CoreModelSerializer shape.
          readOnly: true
      type: object
      required:
      - slxId
      - created
      - modified
      - spec
      - status
      title: SliResponse
      description: "Legacy V1/V3 shape: V4 fields + computed ``spec`` and ``status`` for Django-era consumers.\n\nSubclassing keeps flat fields in lock-step with V4. Computed fields rebuild the\nCRD-shape sub-objects from flat ones at serialization time. Sunset path: when\nexternal consumers fully migrate to /api/v4, delete this subclass.\n\nLegacy wire keys preserved by overriding aliased timestamp fields:\n  - ``created_at`` → alias ``created``   (was ``createdAt`` in V4)\n  - ``modified_at`` → alias ``modified``  (was ``modifiedAt`` in V4)"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /api/v3/token/ or Auth0 login
