      - BearerAuth: []
  /api/v1/workspaces/{workspace_name}/sync:
    post:
      tags:
      - sync
      summary: Upsert a Workspace
      description: 'Upsert a Workspace record.


        Workspace deletion is handled by the dedicated workspace deletion flow

        and is not exposed here.'
      operationId: sync_workspace_api_v1_workspaces__workspace_name__sync_post
      parameters:
      - name: workspace_name
        in: path
        required: true
        schema:
          type: string
          title: Workspace Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DeleteResponse:
      properties:
        status:
          type: string
          title: Status
        name:
          type: string
          title: Name
        resource_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resource Id
      type: object
      required:
      - status
      - name
      title: DeleteResponse
      description: Response for a soft-delete operation.
    ReconcileTasksResponse:
      properties:
        workspace:
          type: string
          title: Workspace
        slx_count:
          type: integer
          title: Slx Count
        task_upserted:
          type: integer
          title: Task Upserted
        task_soft_deleted:
          type: integer
          title: Task Soft Deleted
      type: object
      required:
      - workspace
      - slx_count
      - task_upserted
      - task_soft_deleted
      title: ReconcileTasksResponse
      description: Response for the dev-only slx_tasks reconcile trigger.
    SyncResponse:
      properties:
        status:
          type: string
          title: Status
        name:
          type: string
          title: Name
        resource_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resource Id
      type: object
      required:
      - status
      - name
      title: SyncResponse
      description: Response for a sync (upsert) operation.
    SyncRequest:
      properties:
        last_synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Synced At
          description: Timestamp from upload task.
        payload:
          additionalProperties: true
          type: object
          title: Payload
          description: Full model payload.
      additionalProperties: false
      type: object
      required:
      - payload
      title: SyncRequest
      description: 'Request body for a sync (upsert) operation.


        ``modified_by`` is *not* accepted from the request body — the server

        derives the writer identity from the JWT via

        :func:`shared.auth.dependencies.get_effective_modifier`. ``extra="forbid"``

        ensures any caller still sending ``modified_by`` (or any other unknown

        key) sees HTTP 422 rather than a silent drop. See RW-998 / the

        ``modified_by`` field removal for rationale.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /api/v3/token/ or Auth0 login
