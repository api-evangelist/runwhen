          - type: 'null'
          title: Alertid
          description: Alert ID - required for slo_alert and sli_alert sources
        webhookId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Webhookid
          description: Webhook ID - required for webhook source
        searchQuery:
          anyOf:
          - type: string
          - type: 'null'
          title: Searchquery
          description: Search query - required for search source
        aliasKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Aliaskey
          description: Custom alias key (e.g. 'PagerDuty-Incident-ID')
        aliasValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Aliasvalue
          description: Custom alias value (e.g. 'P12345')
        skipNextStepsAnalysis:
