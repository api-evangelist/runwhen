        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Workspace Run Session Activities Api V1 Workspaces  Workspace Name  Runsessions  Runsession Id  Activities Get
        '422':
